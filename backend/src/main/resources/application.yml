spring:
  profiles:
    active: dev

  application:
    name: catalogo-musical-api

  jackson:
    time-zone: America/Sao_Paulo
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catalogo_musical}
    username: ${DB_USERNAME:catalogo_user}
    password: ${DB_PASSWORD:catalogo_pass}

    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: HikariCP-DEV
      auto-commit: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

application:
  name: @project.name@
  description: @project.description@
  env: ${spring.profiles.active}
  version: @project.version@
  endpoint: http://localhost:8080
  security:
    jwt:
      secret: ${JWT_SECRET:Qv9J8yP7mGxKZr5Yd4C6XcB1t3UuA0EwM2pH8LqNfSDoR7aWkKZJ5c9BVe6xM0yT}

  integrations:
    minio:
      endpoint: http://localhost:9000
      access-key: minioadmin
      secret-key: minioadmin
      bucket-name: imagens

    argus:
      endpoint: https://integrador-argus-api.geia.vip

  scheduler:
    regional-sync:
      enabled: true
      cron: "*/30 * * * * *"

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate: WARN
    org.hibernate.orm: WARN
    org.springframework: INFO
    org.springframework.security: INFO
    br.gov.mt.seplag: DEBUG
    org.liquibase: INFO
    com.zaxxer.hikari: INFO