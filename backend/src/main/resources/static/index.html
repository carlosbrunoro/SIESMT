<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste WebSocket - Novo Álbum</title>
</head>
<body>

<h2>WebSocket – Teste Novo Álbum</h2>
<p id="status">Desconectado</p>

<ul id="mensagens"></ul>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script>
    const status = document.getElementById("status");
    const mensagens = document.getElementById("mensagens");

    const socket = new SockJS("/ws");
    const stompClient = Stomp.over(socket);

    stompClient.connect({}, function () {
        status.textContent = "Conectado";

        stompClient.subscribe("/topic/novo-album", function (message) {
            const data = JSON.parse(message.body);

            const li = document.createElement("li");
            li.textContent = "Novo álbum recebido: " + JSON.stringify(data);

            mensagens.appendChild(li);
        });
    });
</script>

</body>
</html>
