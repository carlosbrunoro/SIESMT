services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catalogo-musical-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MINIO_INTERNAL_URL: http://minio:9000
      MINIO_PUBLIC_URL: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/catalogo_musical
      SPRING_DATASOURCE_USERNAME: catalogo_user
      SPRING_DATASOURCE_PASSWORD: catalogo_pass
    depends_on:
      - db
      - minio

  db:
    image: postgres:16-alpine
    container_name: catalogo-musical-db
    environment:
      POSTGRES_DB: catalogo_musical
      POSTGRES_USER: catalogo_user
      POSTGRES_PASSWORD: catalogo_pass
    ports:
      - "5432:5432"
    volumes:
      - seplag_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_SERVER_URL: http://minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - seplag_minio_data:/data
    restart: unless-stopped

volumes:
  seplag_pgdata:
    name: seplag_postgres_data
  seplag_minio_data:
    name: seplag_minio_data